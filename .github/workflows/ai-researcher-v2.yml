name: AI Researcher v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-researcher-v2
  cancel-in-progress: false

jobs:
  result:
    name: "A — Result"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -d pnn-v1/results
          echo "Latest repository evidence is available."

  context:
    name: "B — Research Context"
    needs: result
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python scripts/build_research_context.py
          test -s research_queue/context/latest.json
          echo "Research Context built successfully."

  ai-analysis:
    name: "C — AI Analysis | GPT-OSS 120B"
    needs: context
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run AI Researcher
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/build_research_context.py
          python scripts/ai_researcher_v2.py
      - name: Publish AI draft
        run: |
          git config user.name "Debatt-AI AI Researcher"
          git config user.email "actions@users.noreply.github.com"
          git add research_queue/context/latest.json research_queue/ai_researcher/latest.json
          git commit -m "AI Researcher v2 draft proposal" || true
          git pull --rebase origin main
          git push

  hypothesis:
    name: "D — Hypothesis"
    needs: ai-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          git pull --ff-only origin main
          python -c 'import json; d=json.load(open("research_queue/ai_researcher/latest.json")); print(d["hypothesis"])'

  proposal:
    name: "E — Proposal"
    needs: hypothesis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          git pull --ff-only origin main
          python -c 'import json; d=json.load(open("research_queue/ai_researcher/latest.json")); p=d["proposal"]; print(p["title"]); print(p["research_question"]); print("Budget:",json.dumps(p["requested_budget"]))'

  validator:
    name: "F — Validator"
    needs: proposal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          git pull --ff-only origin main
          python - <<'PY'
          import json
          d=json.load(open("research_queue/ai_researcher/latest.json"))
          p=d["proposal"]
          assert d["status"]=="draft_requires_human_review"
          assert p["requires_human_approval"] is True
          keys=("max_parameters","max_candidates","max_epochs","max_train_samples","max_test_samples")
          assert all(isinstance(p["requested_budget"].get(k),int) and p["requested_budget"][k]>0 for k in keys)
          print("AI proposal passed proposal-only validation.")
          PY

  approval-gate:
    name: "G — Awaiting Human Approval"
    needs: validator
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "AI Researcher chain completed."
          echo "No Q.ANT compute has been started."
          echo "Human approval is required before an experiment can run."
