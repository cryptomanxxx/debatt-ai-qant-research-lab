name: AI Researcher v2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-researcher-v2
  cancel-in-progress: false

jobs:
  researcher:
    name: "1 - AI Researcher"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build research context
        run: |
          python scripts/build_research_context.py
          test -s research_queue/context/latest.json
      - name: Generate research proposal
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/ai_researcher_v2.py
      - name: Validate proposal draft
        run: |
          python -c 'import json; d=json.load(open("research_queue/ai_researcher/latest.json")); p=d["proposal"]; assert d["status"]=="draft_requires_human_review"; assert p["requires_human_approval"] is True; keys=("max_parameters","max_candidates","max_epochs","max_train_samples","max_test_samples"); assert all(isinstance(p["requested_budget"].get(k),int) and p["requested_budget"][k]>0 for k in keys)'
      - name: Show readable research proposal
        run: |
          python scripts/render_ai_researcher_summary.py
      - name: Publish proposal draft
        run: |
          git config user.name "Debatt-AI AI Researcher"
          git config user.email "actions@users.noreply.github.com"
          git add research_queue/context/latest.json research_queue/ai_researcher/latest.json
          git commit -m "AI Researcher v2 draft proposal" || true
          git pull --rebase origin main
          git push

  approval:
    name: "2 - Human Approval"
    needs: researcher
    runs-on: ubuntu-latest
    environment:
      name: qant-research-approval
    steps:
      - name: Approval received
        run: |
          echo "Human approval received."

  qant:
    name: "3 - Q.ANT Research"
    needs: approval
    runs-on: ubuntu-latest
    steps:
      - name: Safe approval bridge
        run: |
          echo "Approval bridge passed."
          echo "No AI-generated Q.ANT experiment is executed automatically yet."
