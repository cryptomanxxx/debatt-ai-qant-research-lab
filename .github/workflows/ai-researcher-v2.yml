name: AI Researcher v2

on:
  workflow_dispatch:
  repository_dispatch:
    types: [human_feedback_revision]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-researcher-v2
  cancel-in-progress: false

jobs:
  researcher:
    name: "1 - AI Researcher"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify automatic revision binding
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          DISPATCH_REVIEW_RUN_ID: ${{ github.event.client_payload.review_run_id }}
          DISPATCH_PROPOSAL_SHA256: ${{ github.event.client_payload.proposal_sha256 }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          review=json.loads(Path("research_queue/human_review/latest.json").read_text())
          review_run=os.environ.get("DISPATCH_REVIEW_RUN_ID","")
          proposal_sha=os.environ.get("DISPATCH_PROPOSAL_SHA256","")
          if not review_run or not proposal_sha:
              raise SystemExit("Automatic revision dispatch is missing immutable human-review binding")
          if review.get("decision")!="reject":
              raise SystemExit("Bound human review is not a rejection")
          if str(review.get("workflow_run_id"))!=review_run or review.get("proposal_sha256")!=proposal_sha:
              raise SystemExit("Latest human review does not match the dispatching review; refusing automatic revision")
          print("Automatic revision is bound to rejected review run",review_run)
          PY
      - name: Record cycle mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          automatic = os.environ["EVENT_NAME"] == "repository_dispatch"
          p=Path("research_queue/cycle/latest.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
              "proposal_workflow_run_id": os.environ["RUN_ID"],
              "proposal_mode": "automatic_revision" if automatic else "manual_start",
              "automatic_revision_allowed": not automatic
          },indent=2)+"\n")
          PY
      - name: Build research context
        run: |
          python scripts/build_research_context.py
          test -s research_queue/context/latest.json
      - name: Generate research proposal
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/ai_researcher_v2.py
      - name: Validate proposal draft
        run: |
          python -c 'import json; d=json.load(open("research_queue/ai_researcher/latest.json")); p=d["proposal"]; assert d["status"]=="draft_requires_human_review"; assert p["requires_human_approval"] is True; keys=("max_parameters","max_candidates","max_epochs","max_train_samples","max_test_samples"); assert all(isinstance(p["requested_budget"].get(k),int) and p["requested_budget"][k]>0 for k in keys)'
      - name: Compile proposal safety check
        run: |
          python scripts/compile_ai_researcher_proposal.py
      - name: Show readable research proposal
        if: success()
        run: |
          python scripts/render_ai_researcher_summary.py
      - name: Publish proposal draft via PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATION_GIT_NAME: "Debatt-AI AI Researcher"
        run: python scripts/publish_via_pr.py "AI Researcher v2 draft proposal" research_queue/context/latest.json research_queue/ai_researcher/latest.json research_queue/compiled/latest.json research_queue/cycle/latest.json

