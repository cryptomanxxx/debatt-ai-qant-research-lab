name: AI Researcher v2

on:
  workflow_dispatch:
  repository_dispatch:
    types: [human_feedback_revision]

permissions:
  contents: write

concurrency:
  group: ai-researcher-v2
  cancel-in-progress: false

jobs:
  researcher:
    name: "1 - AI Researcher"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record cycle mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          automatic = os.environ["EVENT_NAME"] == "repository_dispatch"
          p=Path("research_queue/cycle/latest.json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps({
              "proposal_workflow_run_id": os.environ["RUN_ID"],
              "proposal_mode": "automatic_revision" if automatic else "manual_start",
              "automatic_revision_allowed": not automatic
          },indent=2)+"\n")
          PY
      - name: Build research context
        run: |
          python scripts/build_research_context.py
          test -s research_queue/context/latest.json
      - name: Generate research proposal
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/ai_researcher_v2.py
      - name: Validate proposal draft
        run: |
          python -c 'import json; d=json.load(open("research_queue/ai_researcher/latest.json")); p=d["proposal"]; assert d["status"]=="draft_requires_human_review"; assert p["requires_human_approval"] is True; keys=("max_parameters","max_candidates","max_epochs","max_train_samples","max_test_samples"); assert all(isinstance(p["requested_budget"].get(k),int) and p["requested_budget"][k]>0 for k in keys)'
      - name: Compile proposal safety check
        run: |
          python scripts/compile_ai_researcher_proposal.py
      - name: Show readable research proposal
        if: success()
        run: |
          python scripts/render_ai_researcher_summary.py
      - name: Publish proposal draft
        run: |
          git config user.name "Debatt-AI AI Researcher"
          git config user.email "actions@users.noreply.github.com"
          git add research_queue/context/latest.json research_queue/ai_researcher/latest.json research_queue/compiled/latest.json research_queue/cycle/latest.json
          git commit -m "AI Researcher v2 draft proposal" || true
          git pull --rebase origin main
          git push

  approval:
    # This Environment gate is compute authorization only. Scientific review and
    # feedback are recorded by review-ai-research-proposal.yml.
    name: "2 - Compute Authorization"
    needs: researcher
    runs-on: ubuntu-latest
    environment:
      name: qant-research-approval
    steps:
      - name: Approval received
        run: |
          echo "Human compute authorization received."

  prepare-qant:
    name: "3 - Prepare Guarded Q.ANT Job"
    needs: approval
    runs-on: ubuntu-latest
    outputs:
      job_id: ${{ steps.job.outputs.job_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Materialize allowlisted approved job
        run: python scripts/materialize_ai_approved_job.py
      - name: Publish approved job
        run: |
          git config user.name "Debatt-AI Research Approver"
          git config user.email "actions@users.noreply.github.com"
          git add research_queue/jobs/ai-w8-confirmation.json
          if git diff --cached --quiet; then
            echo "Approved job already exists."
          else
            git commit -m "Approve AI Researcher w8 confirmation"
            git pull --rebase origin main
            git push
          fi
      - name: Expose approved job ID
        id: job
        run: echo "job_id=ai-w8-confirmation" >> "$GITHUB_OUTPUT"

  qant:
    name: "4 - Q.ANT Guarded Research"
    needs: prepare-qant
    uses: ./.github/workflows/qant-research-queue-v2.yml
    with:
      job_id: ${{ needs.prepare-qant.outputs.job_id }}
    secrets: inherit
