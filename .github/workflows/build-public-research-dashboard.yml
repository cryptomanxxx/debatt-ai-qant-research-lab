name: Build Public Research Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "results/exp*.json"
      - "pnn-v1/results/result*.json"
      - "scripts/build_research_dashboard.py"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: public-research-dashboard
  cancel-in-progress: false

jobs:
  build-dashboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build public dashboard JSON
        run: python scripts/build_research_dashboard.py
      - name: Publish dashboard via PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_via_pr.py "Update public research dashboard" public/research-dashboard.json
