name: CL Research Charts — optional GitHub Pages publication

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cl-research-pages
  cancel-in-progress: false

jobs:
  publish-static-report:
    name: Publish CL charts (manual, public, NO TRAINING)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate offline visualization contracts
        run: python -m unittest -v tests.test_cl3r_visualization_contract
      - name: Generate static HTML and SVG only
        run: python -m integrations.continual_learning.cl3r_visualization --output-dir _site
      - name: Create Pages entry page
        run: cp _site/report.html _site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy public Pages report (requires configured Pages)
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Link published chart website
        run: |
          echo "## CL static research charts — published Pages site" >> "$GITHUB_STEP_SUMMARY"
          echo "Open the HTML/SVG report: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "No training, inference or physical energy measurement was performed." >> "$GITHUB_STEP_SUMMARY"
