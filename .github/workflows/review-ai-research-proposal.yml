name: Review AI Research Proposal

on:
  workflow_dispatch:
    inputs:
      decision:
        description: "Scientific decision for the latest AI Researcher proposal"
        required: true
        type: choice
        options:
          - reject
          - approve
      comment:
        description: "Scientific review feedback (AI Researcher reads this on the next iteration)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  review:
    name: "Human Research Review"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record versioned human feedback
        env:
          DECISION: ${{ github.event.inputs.decision }}
          COMMENT: ${{ github.event.inputs.comment }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          proposal_path=Path("research_queue/ai_researcher/latest.json")
          compiled_path=Path("research_queue/compiled/latest.json")
          if not proposal_path.exists():
              raise SystemExit("No AI Researcher proposal exists")

          raw=proposal_path.read_bytes()
          p=json.loads(raw)
          cycle_path=Path("research_queue/cycle/latest.json")
          cycle=json.loads(cycle_path.read_text()) if cycle_path.exists() else {}
          compiled=json.loads(compiled_path.read_text()) if compiled_path.exists() else None
          stamp=datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          out={
              "proposal_title":p["proposal"]["title"],
              "proposal_status_at_review":p["status"],
              "proposal_sha256":hashlib.sha256(raw).hexdigest(),
              "compiler_status":compiled.get("status") if compiled else None,
              "approval_readiness":compiled.get("approval_readiness") if compiled else None,
              "decision":os.environ["DECISION"],
              "comment":os.environ["COMMENT"],
              "reviewer":os.environ["ACTOR"],
              "workflow_run_id":os.environ["RUN_ID"],
              "proposal_workflow_run_id":cycle.get("proposal_workflow_run_id"),
              "proposal_mode":cycle.get("proposal_mode"),
              "reviewed_at_utc":stamp,
          }
          root=Path("research_queue/human_review")
          history=root/"history"
          history.mkdir(parents=True,exist_ok=True)
          text=json.dumps(out,indent=2,ensure_ascii=False)+"\n"
          (root/"latest.json").write_text(text)
          (history/f"{stamp}-run-{os.environ['RUN_ID']}.json").write_text(text)
          print("Human research decision:",out["decision"])
          print("Proposal:",out["proposal_title"])
          print("Compiler readiness:",out["approval_readiness"])
          PY
      - name: Publish human feedback via PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATION_GIT_NAME: "Debatt-AI Human Review"
        run: python scripts/publish_via_pr.py "Record human research decision: ${{ github.event.inputs.decision }}" research_queue/human_review/
      - name: Rejection recorded
        if: ${{ github.event.inputs.decision == 'reject' }}
        id: rejection
        run: |
          echo "Scientific proposal rejected."
          echo "Feedback is now part of AI Researcher's memory. No compute is authorized."
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("research_queue/cycle/latest.json")
          cycle=json.loads(p.read_text()) if p.exists() else {}
          allowed=cycle.get("automatic_revision_allowed") is True
          proposal_run_id=cycle.get("proposal_workflow_run_id")
          if not isinstance(proposal_run_id,str) or not proposal_run_id.isdigit():
              raise SystemExit("Missing/invalid proposal_workflow_run_id; refusing to cancel an unbound run")
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write(f"auto_revision={'true' if allowed else 'false'}\n")
              out.write(f"proposal_run_id={proposal_run_id}\n")
          print("Automatic revision allowed:",allowed)
          print("Bound proposal workflow run:",proposal_run_id)
          PY
      - name: Start one automatic revision
        if: ${{ github.event.inputs.decision == 'reject' }} && steps.rejection.outputs.auto_revision == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/dispatches \
            -f event_type=human_feedback_revision
          echo "Started the one permitted automatic revision."
      - name: Automatic revision limit reached
        if: ${{ github.event.inputs.decision == 'reject' }} && steps.rejection.outputs.auto_revision != 'true'
        run: |
          echo "No new proposal started automatically."
          echo "The current proposal was already the automatic revision; a new cycle requires a manual AI Researcher v2 run."
      - name: Verify proposal is executable before compute authorization
        if: ${{ github.event.inputs.decision == 'approve' }}
        run: |
          python - <<'PY'
          import json
          d=json.load(open("research_queue/compiled/latest.json"))
          if d.get("status")!="validated_executable_template" or d.get("approval_readiness")!="READY_FOR_HUMAN_COMPUTE_DECISION":
              raise SystemExit("Scientific approval recorded, but compiler has not cleared this proposal for compute.")
          print("Compiler cleared proposal for human compute authorization.")
          PY
      - name: Request separate compute authorization
        if: ${{ github.event.inputs.decision == 'approve' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/${{ github.repository }}/dispatches \
            -f event_type=scientifically_approved_compute
          echo "Scientific review approved. Separate Compute Authorization requested."
