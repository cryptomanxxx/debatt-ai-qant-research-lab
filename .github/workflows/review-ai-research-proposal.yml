name: Review AI Research Proposal

on:
  workflow_dispatch:
    inputs:
      decision:
        description: "Scientific decision for the latest AI Researcher proposal"
        required: true
        type: choice
        options:
          - reject
          - approve
      comment:
        description: "Scientific review feedback (AI Researcher reads this on the next iteration)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  review:
    name: "Human Research Review"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record versioned human feedback
        env:
          DECISION: ${{ inputs.decision }}
          COMMENT: ${{ inputs.comment }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          proposal_path=Path("research_queue/ai_researcher/latest.json")
          compiled_path=Path("research_queue/compiled/latest.json")
          if not proposal_path.exists():
              raise SystemExit("No AI Researcher proposal exists")

          raw=proposal_path.read_bytes()
          p=json.loads(raw)
          compiled=json.loads(compiled_path.read_text()) if compiled_path.exists() else None
          stamp=datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          out={
              "proposal_title":p["proposal"]["title"],
              "proposal_status_at_review":p["status"],
              "proposal_sha256":hashlib.sha256(raw).hexdigest(),
              "compiler_status":compiled.get("status") if compiled else None,
              "approval_readiness":compiled.get("approval_readiness") if compiled else None,
              "decision":os.environ["DECISION"],
              "comment":os.environ["COMMENT"],
              "reviewer":os.environ["ACTOR"],
              "workflow_run_id":os.environ["RUN_ID"],
              "reviewed_at_utc":stamp,
          }
          root=Path("research_queue/human_review")
          history=root/"history"
          history.mkdir(parents=True,exist_ok=True)
          text=json.dumps(out,indent=2,ensure_ascii=False)+"\n"
          (root/"latest.json").write_text(text)
          (history/f"{stamp}-run-{os.environ['RUN_ID']}.json").write_text(text)
          print("Human research decision:",out["decision"])
          print("Proposal:",out["proposal_title"])
          print("Compiler readiness:",out["approval_readiness"])
          PY
      - name: Publish human feedback
        run: |
          git config user.name "Debatt-AI Human Review"
          git config user.email "actions@users.noreply.github.com"
          git add research_queue/human_review/
          git commit -m "Record human research decision: ${{ inputs.decision }}"
          git pull --rebase origin main
          git push
      - name: Rejection recorded
        if: inputs.decision == 'reject'
        run: |
          echo "Scientific proposal rejected."
          echo "Feedback is now part of AI Researcher's memory. No compute is authorized."
      - name: Scientific approval recorded
        if: inputs.decision == 'approve'
        run: |
          echo "Scientific review approved."
          echo "This does NOT authorize compute."
          echo "Compute still requires the separate qant-research-approval Environment gate."
