name: Build Research Context
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/build_research_context.py
      - name: Publish context via PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATION_GIT_NAME: "Debatt-AI Research Lab"
        run: python scripts/publish_via_pr.py "Build AI Researcher evidence context" research_queue/context/latest.json
