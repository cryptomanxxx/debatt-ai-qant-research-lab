name: Build Research Context
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/build_research_context.py
      - name: Publish context
        run: |
          git config user.name "Debatt-AI Research Lab"
          git config user.email "actions@users.noreply.github.com"
          git add research_queue/context/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build AI Researcher evidence context"
          git push
