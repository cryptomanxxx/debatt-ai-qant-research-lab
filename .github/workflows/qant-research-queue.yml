name: Q.ANT Research Queue

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Research job ID"
        required: true
        default: "smoke-test"
        type: string

permissions:
  contents: write

concurrency:
  group: qant-research-queue
  cancel-in-progress: false

jobs:
  run-job:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Q.ANT CPU backend
        run: bash scripts/setup_qant_cpu.sh

      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision numpy ml_dtypes

      - name: Run queued research job
        run: python scripts/run_research_job.py "${{ inputs.job_id }}"

      - name: Publish generated results
        if: success()
        run: |
          mkdir -p results
          shopt -s nullglob
          files=(local_results/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No files found in local_results/"
            exit 1
          fi
          cp -f local_results/* results/
          git config user.name "Debatt-AI Research Runner"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No new result changes to commit."
            exit 0
          fi
          git commit -m "Publish research job ${{ inputs.job_id }} results"
          git push
