name: Validate Global Experiment Catalog

on:
  pull_request:
    paths:
      - 'scripts/build_experiment_catalog.py'
      - 'tests/test_build_experiment_catalog.py'
      - 'docs/global-experiment-catalog.md'
      - 'docs/current-systems-and-protocols.md'
      - 'docs/README.md'
      - 'README.md'
      - 'public/experiment-catalog.json'
      - '.github/workflows/validate-global-experiment-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline_catalog:
    name: Read-only catalog and provenance contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Synthetic fixtures and real repository inventory
        run: python -m unittest discover -s tests -p 'test_build_experiment_catalog.py' -v
      - name: Generate catalog without provider/API/compute usage
        run: python -m scripts.build_experiment_catalog --output /tmp/experiment-catalog.json
      - name: Expose initial derived snapshot for review
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          data = Path("/tmp/experiment-catalog.json").read_bytes()
          print("CATALOG_B64_BEGIN")
          print(base64.b64encode(data).decode("ascii"))
          print("CATALOG_B64_END")
          PY
      - name: Check committed snapshot freshness if present
        run: |
          if test -f public/experiment-catalog.json; then
            python -m scripts.build_experiment_catalog --check
          else
            echo "Initial catalog snapshot not yet committed; checking generated artifact only."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: global-experiment-catalog
          path: /tmp/experiment-catalog.json
          retention-days: 30
          if-no-files-found: error
