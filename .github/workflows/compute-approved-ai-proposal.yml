name: Compute Approved AI Research Proposal

on:
  repository_dispatch:
    types: [scientifically_approved_compute]

permissions:
  contents: write
  pull-requests: write

jobs:
  authorize:
    name: "Compute Authorization"
    runs-on: ubuntu-latest
    environment:
      name: qant-research-approval
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify scientific approval and compiler readiness
        env:
          DISPATCH_PROPOSAL_SHA256: ${{ github.event.client_payload.proposal_sha256 }}
          DISPATCH_PROPOSAL_RUN_ID: ${{ github.event.client_payload.proposal_workflow_run_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          proposal=Path("research_queue/ai_researcher/latest.json").read_bytes()
          review=json.load(open("research_queue/human_review/latest.json"))
          compiled=json.load(open("research_queue/compiled/latest.json"))
          current_sha=hashlib.sha256(proposal).hexdigest()
          dispatched_sha=os.environ.get("DISPATCH_PROPOSAL_SHA256","")
          dispatched_run=os.environ.get("DISPATCH_PROPOSAL_RUN_ID","")
          if not dispatched_sha or not dispatched_run:
              raise SystemExit("Compute dispatch is missing immutable proposal binding")
          if review.get("decision")!="approve":
              raise SystemExit("Latest scientific review is not approve")
          if review.get("proposal_sha256")!=dispatched_sha or str(review.get("proposal_workflow_run_id"))!=dispatched_run:
              raise SystemExit("Compute dispatch does not match the recorded scientific approval")
          if current_sha!=dispatched_sha:
              raise SystemExit("Current proposal changed after scientific approval; refusing compute")
          if compiled.get("status")!="validated_executable_template" or compiled.get("approval_readiness")!="READY_FOR_HUMAN_COMPUTE_DECISION":
              raise SystemExit("Compiler has not cleared current proposal for compute")
          print("Scientific approval, dispatch, and current proposal are immutably bound; compute authorization received.")
          PY

  prepare-qant:
    name: "Prepare Guarded Q.ANT Job"
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      job_id: ${{ steps.job.outputs.job_id }}
      approved_commit_sha: ${{ steps.commit.outputs.approved_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Materialize allowlisted approved job
        run: python scripts/materialize_ai_approved_job.py
      - name: Publish approved job via PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATION_GIT_NAME: "Debatt-AI Research Approver"
        run: python scripts/publish_via_pr.py "Approve guarded AI Research job" research_queue/jobs/
      - name: Resolve immutable approved-job commit
        id: commit
        run: |
          git fetch origin main
          echo "approved_commit_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
      - name: Expose approved job ID
        id: job
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          print("job_id="+json.load(open("research_queue/compiled/latest.json"))["job_id"])
          PY

  qant:
    name: "Q.ANT Guarded Research"
    needs: prepare-qant
    uses: ./.github/workflows/qant-research-queue-v2.yml
    with:
      job_id: ${{ needs.prepare-qant.outputs.job_id }}
      approved_commit_sha: ${{ needs.prepare-qant.outputs.approved_commit_sha }}
    secrets: inherit
