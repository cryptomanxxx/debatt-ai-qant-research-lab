name: CL-16 Archive Verified H1 Data (NO MODEL)

on:
  pull_request:
    paths:
      - '.github/workflows/cl16-extract-reviewed-data.yml'

permissions:
  contents: read
  actions: read

jobs:
  check_and_export_previously_verified_bytes:
    if: github.event.pull_request.head.repo.full_name == 'cryptomanxxx/debatt-ai-qant-research-lab' && github.event.pull_request.head.ref == 'cl16-archive-original-h1-data'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download only CL-13 artifact ID source run 41432369864
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41432369864 --repo cryptomanxxx/debatt-ai-qant-research-lab --name cl13-data-only-unapproved-candidate --dir cl16-original-bytes
      - name: Independently verify all original records before archival handoff (NO MODEL)
        run: python -B integrations/continual_learning/cl14_independent_artifact_audit.py cl16-original-bytes .
      - name: Export verified public synthetic files to authenticated PR author
        run: |
          python -B -c 'import base64,pathlib; p=pathlib.Path("cl16-original-bytes"); names=["manifest.json"]+[f"seed-{i}.json" for i in range(101,106)]; [(print("CL16FILE "+name+" "+base64.b64encode((p/name).read_bytes()).decode("ascii"))) for name in names]'
