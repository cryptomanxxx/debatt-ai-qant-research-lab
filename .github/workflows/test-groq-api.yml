name: Test Groq API Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-groq:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secret is configured
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY is not configured"
            exit 1
          fi
          echo "GROQ_API_KEY is configured."

      - name: Diagnose Groq API access
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          def call(url, method="GET", payload=None):
              headers = {
                  "Authorization": f"Bearer {os.environ['GROQ_API_KEY']}",
                  "Accept": "application/json",
                  "User-Agent": "debatt-ai-qant-research-lab/1.0",
              }
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.headers.get("content-type", ""), r.read().decode(errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get("content-type", ""), e.read().decode(errors="replace")

          status, ctype, body = call("https://api.groq.com/openai/v1/models")
          print(f"/models HTTP {status}; content-type={ctype}")
          if status != 200:
              print("Response preview:", body[:1000])
              raise SystemExit(
                  "Groq access failed already at /models. The secret exists, but this runner/request is being denied before a model completion can be tested."
              )

          models = json.loads(body).get("data", [])
          ids = sorted(m.get("id", "") for m in models if m.get("id"))
          print(f"Groq authenticated successfully. Accessible models: {len(ids)}")
          target = "openai/gpt-oss-20b"
          print(f"Target model {target!r} available:", target in ids)

          if target not in ids:
              print("First accessible model IDs:", ", ".join(ids[:20]))
              raise SystemExit(f"Authentication works, but {target} is not available to this Groq project/key.")

          payload = {
              "model": target,
              "messages": [{"role": "user", "content": "Reply with exactly: GROQ_OK"}],
              "max_completion_tokens": 32,
          }
          status, ctype, body = call(
              "https://api.groq.com/openai/v1/chat/completions", "POST", payload
          )
          print(f"/chat/completions HTTP {status}; content-type={ctype}")
          if status != 200:
              print("Response preview:", body[:1000])
              raise SystemExit("Groq authentication/model discovery works, but the completion request was denied.")

          response = json.loads(body)
          answer = response["choices"][0]["message"]["content"].strip()
          print("Groq response:", answer)
          if "GROQ_OK" not in answer:
              raise SystemExit("Groq responded, but the expected smoke-test marker was missing.")
          print("Groq API smoke test passed.")
          PY
