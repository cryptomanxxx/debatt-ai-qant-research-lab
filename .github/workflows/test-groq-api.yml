name: Test Groq API Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-groq:
    name: "Groq chain: A → B → C → D → E"
    runs-on: ubuntu-latest
    steps:
      - name: "A ✅ Start chain"
        run: echo "A complete — GitHub runner started."

      - name: "B ✅ Verify GROQ_API_KEY"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY is not configured"
            exit 1
          fi
          echo "GROQ_API_KEY is configured."

      - name: "C → D → E | Authenticate, discover 120B, run inference"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          def call(url, method="GET", payload=None):
              headers = {
                  "Authorization": f"Bearer {os.environ['GROQ_API_KEY']}",
                  "Accept": "application/json",
                  "User-Agent": "debatt-ai-qant-research-lab/1.0",
              }
              data = None
              if payload is not None:
                  headers["Content-Type"] = "application/json"
                  data = json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.headers.get("content-type", ""), r.read().decode(errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get("content-type", ""), e.read().decode(errors="replace")

          status, ctype, body = call("https://api.groq.com/openai/v1/models")
          print("C: Authenticating with Groq and requesting /models ...")
          print(f"C result: /models HTTP {status}; content-type={ctype}")
          if status != 200:
              print("Response preview:", body[:1000])
              raise SystemExit(
                  "Groq access failed already at /models. The secret exists, but this runner/request is being denied before a model completion can be tested."
              )

          models = json.loads(body).get("data", [])
          ids = sorted(m.get("id", "") for m in models if m.get("id"))
          print(f"C GREEN: Groq authenticated successfully. Accessible models: {len(ids)}")
          target = "openai/gpt-oss-120b"
          print("D: Checking GPT-OSS 120B availability ...")
          print(f"D result: Target model {target!r} available:", target in ids)

          if target not in ids:
              print("First accessible model IDs:", ", ".join(ids[:20]))
              raise SystemExit(f"Authentication works, but {target} is not available to this Groq project/key.")

          print("D GREEN: GPT-OSS 120B is available.")
          print("E: Sending inference request to GPT-OSS 120B ...")
          payload = {
              "model": target,
              "messages": [{"role": "user", "content": "Reply with exactly: GROQ_OK"}],
              "max_completion_tokens": 128,
              "temperature": 0,
          }
          status, ctype, body = call(
              "https://api.groq.com/openai/v1/chat/completions", "POST", payload
          )
          print(f"E result: /chat/completions HTTP {status}; content-type={ctype}")
          if status != 200:
              print("Response preview:", body[:1000])
              raise SystemExit("Groq authentication/model discovery works, but the completion request was denied.")

          response = json.loads(body)
          message = response["choices"][0]["message"]
          answer = (message.get("content") or "").strip()
          finish_reason = response["choices"][0].get("finish_reason")
          print("Groq finish_reason:", finish_reason)
          print("Groq response:", answer if answer else "<empty content>")
          if not answer:
              print("Groq authenticated, model discovery succeeded, and /chat/completions returned HTTP 200.")
              print("E GREEN: GPT-OSS 120B inference succeeded; the tiny marker prompt produced no visible content.")
          elif "GROQ_OK" in answer:
              print("E GREEN: GPT-OSS 120B inference succeeded.")
          else:
              print("E GREEN: GPT-OSS 120B inference succeeded; model returned content different from the requested marker.")
          PY
