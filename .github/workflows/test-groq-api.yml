name: Test Groq API Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-groq:
    name: "Groq chain: A → B → C → D → E"
    runs-on: ubuntu-latest
    steps:
      - name: "A — Start workflow"
        run: echo "A complete — GitHub runner started."

      - name: "B — Verify GROQ_API_KEY"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          test -n "$GROQ_API_KEY"
          echo "B complete — secret is configured."

      - name: "C — Authenticate with Groq"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          code=$(curl -sS -o /tmp/models.json -w "%{http_code}"             -H "Authorization: Bearer $GROQ_API_KEY"             -H "Accept: application/json"             -H "User-Agent: debatt-ai-qant-research-lab/1.0"             https://api.groq.com/openai/v1/models)
          echo "Groq /models HTTP $code"
          test "$code" = "200"
          echo "C complete — Groq authentication succeeded."

      - name: "D — Verify GPT-OSS 120B"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          curl -fsS             -H "Authorization: Bearer $GROQ_API_KEY"             -H "Accept: application/json"             -H "User-Agent: debatt-ai-qant-research-lab/1.0"             https://api.groq.com/openai/v1/models > /tmp/models.json
          python - <<'PY'
          import json
          ids = {m["id"] for m in json.load(open("/tmp/models.json"))["data"]}
          target = "openai/gpt-oss-120b"
          print("Accessible models:", len(ids))
          print("GPT-OSS 120B available:", target in ids)
          if target not in ids:
              raise SystemExit("GPT-OSS 120B is not available to this key/project.")
          print("D complete — GPT-OSS 120B is available.")
          PY

      - name: "E — Run GPT-OSS 120B inference"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload = {
              "model": "openai/gpt-oss-120b",
              "messages": [{"role": "user", "content": "Reply with exactly: GROQ_120B_OK"}],
              "max_completion_tokens": 128,
              "temperature": 0
          }
          req = urllib.request.Request(
              "https://api.groq.com/openai/v1/chat/completions",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GROQ_API_KEY']}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "debatt-ai-qant-research-lab/1.0"
              },
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              response = json.load(r)
          choice = response["choices"][0]
          answer = (choice["message"].get("content") or "").strip()
          print("finish_reason:", choice.get("finish_reason"))
          print("response:", answer if answer else "<empty content>")
          print("E complete — GPT-OSS 120B inference succeeded.")
          PY
