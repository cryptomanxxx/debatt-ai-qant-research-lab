name: Continual Learning CPU Contracts

on:
  # Run the same no-training contracts against the actual squash-merge
  # commit, not only the pre-merge PR head / synthetic merge ref.
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'integrations/continual_learning/**'
      - 'tests/test_cl1_cpu_smoke.py'
      - 'tests/test_cl1_dense_control_contract.py'
      - 'tests/test_cl2_protocol_contract.py'
      - 'tests/test_cl2_data_candidate_contract.py'
      - 'tests/test_cl2_design_audit_contract.py'
      - 'tests/test_cl2_shared_rule_candidate_contract.py'
      - 'tests/test_cl2_nonlinear_control_contract.py'
      - 'tests/test_cl2_mlp_baseline_contract.py'
      - 'tests/test_cl2_local_mlp_contract.py'
      - 'tests/test_cl2_paired_run_plan_contract.py'
      - 'tests/test_cl2_operation_accounting_contract.py'
      - 'tests/test_cl2_sparse_forward_contract.py'
      - 'tests/test_cl2_payload_proxy_contract.py'
      - 'tests/test_cl2_shared_index_forward_contract.py'
      - 'tests/test_cl3a_readiness_contract.py'
      - 'tests/test_cl3b_preflight_contract.py'
      - 'tests/test_cl3c_dataset_audit_contract.py'
      - 'tests/test_cl3d_analysis_contract.py'
      - 'tests/test_cl3e_measurement_ledger_contract.py'
      - 'tests/test_cl3f_scientific_gate_audit_contract.py'
      - 'tests/test_cl3g_conditional_audit_contract.py'
      - 'tests/test_cl3h_diagnostic_contract.py'
      - 'tests/test_cl3i_energy_method_contract.py'
      - 'tests/test_cl3j_artifact_contract.py'
      - 'tests/test_cl3k_pair_integrity_contract.py'
      - 'tests/test_cl3l_source_fingerprint_contract.py'
      - 'tests/test_cl3m_reference_controls_contract.py'
      - 'tests/test_cl3n_inference_accounting_contract.py'
      - 'tests/test_cl3r_visualization_contract.py'
      - 'tests/test_cl3t_crossover_analysis_contract.py'
      - 'tests/test_cl3u_sensitivity_contract.py'
      - 'tests/test_cl3v_cost_components_contract.py'
      - 'tests/test_cl3w_h1_evidence_contract.py'
      - 'tests/test_cl3x_h1_protocol_review_contract.py'
      - 'tests/test_cl3y_readiness_audit_contract.py'
      - 'tests/test_cl4a_h1_measurement_contract.py'
      - 'tests/test_cl4b_source_event_probe_contract.py'
      - 'tests/test_cl4c_source_correspondence_contract.py'
      - 'tests/test_cl4d_forward_weight_read_audit_contract.py'
      - 'tests/test_cl4e_overhead_contract.py'
      - 'tests/test_cl5a_provenance_source_audit_contract.py'
      - 'tests/test_post_merge_offline_ci_contract.py'
      - 'tests/test_cl9g_protocol_consistency.py'
      - 'tests/test_cl3o_activity_weighted_inference_contract.py'
      - 'tests/test_cl3p_activity_weighted_training_contract.py'
      - 'tests/test_cl3q_joint_cost_review_contract.py'
      - 'tests/test_cl3r_visualization_contract.py'
      - '.github/workflows/cl3r-research-visualization.yml'
      - '.github/workflows/cl3s-publish-pages.yml'
      - '.github/workflows/continual-learning-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cl1_contracts:
    name: CL-1 deterministic contracts (no research run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile CL-1/CL-2/CL-3 offline modules
        run: python -m py_compile integrations/continual_learning/cl1_cpu.py integrations/continual_learning/cl1_dense_control.py integrations/continual_learning/cl2_protocol.py integrations/continual_learning/cl2_data_candidate.py integrations/continual_learning/cl2_design_audit.py integrations/continual_learning/cl2_shared_rule_candidate.py integrations/continual_learning/cl2_nonlinear_control.py integrations/continual_learning/cl2_mlp_baseline.py integrations/continual_learning/cl2_local_mlp.py integrations/continual_learning/cl2_paired_run_plan.py integrations/continual_learning/cl2_operation_accounting.py integrations/continual_learning/cl2_sparse_forward.py integrations/continual_learning/cl2_payload_proxy.py integrations/continual_learning/cl2_shared_index_forward.py integrations/continual_learning/cl3b_preflight.py integrations/continual_learning/cl3b_result_contract.py integrations/continual_learning/cl3c_dataset_audit.py integrations/continual_learning/cl3d_analysis_contract.py integrations/continual_learning/cl3e_measurement_ledger.py integrations/continual_learning/cl3f_scientific_gate_audit.py integrations/continual_learning/cl3g_conditional_audit.py integrations/continual_learning/cl3h_diagnostic_contract.py integrations/continual_learning/cl3i_energy_method.py integrations/continual_learning/cl3j_artifact_contract.py integrations/continual_learning/cl3k_pair_integrity.py integrations/continual_learning/cl3l_source_fingerprint.py integrations/continual_learning/cl3m_reference_controls.py integrations/continual_learning/cl3n_inference_accounting.py integrations/continual_learning/cl3o_activity_weighted_inference.py integrations/continual_learning/cl3p_activity_weighted_training.py integrations/continual_learning/cl3q_joint_cost_review.py integrations/continual_learning/cl3r_visualization.py integrations/continual_learning/cl3t_crossover_analysis.py integrations/continual_learning/cl3u_sensitivity.py integrations/continual_learning/cl3v_cost_components.py integrations/continual_learning/cl3w_h1_evidence.py integrations/continual_learning/cl3x_h1_protocol_review.py integrations/continual_learning/cl3y_readiness_audit.py integrations/continual_learning/cl4a_h1_measurement_contract.py integrations/continual_learning/cl4b_source_event_probe.py integrations/continual_learning/cl4c_source_correspondence.py integrations/continual_learning/cl4d_forward_weight_read_audit.py integrations/continual_learning/cl4e_overhead_contract.py integrations/continual_learning/cl5a_provenance_source_audit.py
      - name: Reconcile CL-9G static H1 scientific protocol (NO TRAINING)
        run: python -m unittest -v tests.test_cl9g_protocol_consistency
      - name: Execute CL-1/CL-2/CL-3 offline contracts only
        run: python -m unittest -v tests.test_cl1_cpu_smoke tests.test_cl1_dense_control_contract tests.test_cl2_protocol_contract tests.test_cl2_data_candidate_contract tests.test_cl2_design_audit_contract tests.test_cl2_shared_rule_candidate_contract tests.test_cl2_nonlinear_control_contract tests.test_cl2_mlp_baseline_contract tests.test_cl2_local_mlp_contract tests.test_cl2_paired_run_plan_contract tests.test_cl2_operation_accounting_contract tests.test_cl2_sparse_forward_contract tests.test_cl2_payload_proxy_contract tests.test_cl2_shared_index_forward_contract tests.test_cl3a_readiness_contract tests.test_cl3b_preflight_contract tests.test_cl3c_dataset_audit_contract tests.test_cl3d_analysis_contract tests.test_cl3e_measurement_ledger_contract tests.test_cl3f_scientific_gate_audit_contract tests.test_cl3g_conditional_audit_contract tests.test_cl3h_diagnostic_contract tests.test_cl3i_energy_method_contract tests.test_cl3j_artifact_contract tests.test_cl3k_pair_integrity_contract tests.test_cl3l_source_fingerprint_contract tests.test_cl3m_reference_controls_contract tests.test_cl3n_inference_accounting_contract tests.test_cl3o_activity_weighted_inference_contract tests.test_cl3p_activity_weighted_training_contract tests.test_cl3q_joint_cost_review_contract tests.test_cl3r_visualization_contract tests.test_cl3t_crossover_analysis_contract tests.test_cl3u_sensitivity_contract tests.test_cl3v_cost_components_contract tests.test_cl3w_h1_evidence_contract tests.test_cl3x_h1_protocol_review_contract tests.test_cl3y_readiness_audit_contract tests.test_cl4a_h1_measurement_contract tests.test_cl4b_source_event_probe_contract tests.test_cl4c_source_correspondence_contract tests.test_cl4d_forward_weight_read_audit_contract tests.test_cl4e_overhead_contract tests.test_cl5a_provenance_source_audit_contract tests.test_post_merge_offline_ci_contract
