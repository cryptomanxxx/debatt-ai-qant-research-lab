name: Continual Learning CPU Contracts

on:
  pull_request:
    paths:
      - 'integrations/continual_learning/**'
      - 'tests/test_cl1_cpu_smoke.py'
      - 'tests/test_cl1_dense_control_contract.py'
      - 'tests/test_cl2_protocol_contract.py'
      - 'tests/test_cl2_data_candidate_contract.py'
      - 'tests/test_cl2_design_audit_contract.py'
      - '.github/workflows/continual-learning-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cl1_contracts:
    name: CL-1 deterministic contracts (no research run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile CL-1/CL-2 modules
        run: python -m py_compile integrations/continual_learning/cl1_cpu.py integrations/continual_learning/cl1_dense_control.py integrations/continual_learning/cl2_protocol.py integrations/continual_learning/cl2_data_candidate.py integrations/continual_learning/cl2_design_audit.py
      - name: Execute CL-1 and CL-2 offline contracts only
        run: python -m unittest -v tests.test_cl1_cpu_smoke tests.test_cl1_dense_control_contract tests.test_cl2_protocol_contract tests.test_cl2_data_candidate_contract tests.test_cl2_design_audit_contract
