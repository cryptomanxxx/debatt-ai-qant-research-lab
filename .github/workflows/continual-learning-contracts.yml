name: Continual Learning CPU Contracts

on:
  pull_request:
    paths:
      - 'integrations/continual_learning/**'
      - 'tests/test_cl1_cpu_smoke.py'
      - 'tests/test_cl1_dense_control_contract.py'
      - 'tests/test_cl2_protocol_contract.py'
      - 'tests/test_cl2_data_candidate_contract.py'
      - 'tests/test_cl2_design_audit_contract.py'
      - 'tests/test_cl2_shared_rule_candidate_contract.py'
      - 'tests/test_cl2_nonlinear_control_contract.py'
      - 'tests/test_cl2_mlp_baseline_contract.py'
      - 'tests/test_cl2_local_mlp_contract.py'
      - 'tests/test_cl2_paired_run_plan_contract.py'
      - 'tests/test_cl2_operation_accounting_contract.py'
      - 'tests/test_cl2_sparse_forward_contract.py'
      - 'tests/test_cl2_payload_proxy_contract.py'
      - 'tests/test_cl2_shared_index_forward_contract.py'
      - 'tests/test_cl3a_readiness_contract.py'
      - 'tests/test_cl3b_preflight_contract.py'
      - 'tests/test_cl3c_dataset_audit_contract.py'
      - 'tests/test_cl3d_analysis_contract.py'
      - '.github/workflows/continual-learning-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cl1_contracts:
    name: CL-1 deterministic contracts (no research run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile CL-1/CL-2/CL-3 offline modules
        run: python -m py_compile integrations/continual_learning/cl1_cpu.py integrations/continual_learning/cl1_dense_control.py integrations/continual_learning/cl2_protocol.py integrations/continual_learning/cl2_data_candidate.py integrations/continual_learning/cl2_design_audit.py integrations/continual_learning/cl2_shared_rule_candidate.py integrations/continual_learning/cl2_nonlinear_control.py integrations/continual_learning/cl2_mlp_baseline.py integrations/continual_learning/cl2_local_mlp.py integrations/continual_learning/cl2_paired_run_plan.py integrations/continual_learning/cl2_operation_accounting.py integrations/continual_learning/cl2_sparse_forward.py integrations/continual_learning/cl2_payload_proxy.py integrations/continual_learning/cl2_shared_index_forward.py integrations/continual_learning/cl3b_preflight.py integrations/continual_learning/cl3b_result_contract.py integrations/continual_learning/cl3c_dataset_audit.py integrations/continual_learning/cl3d_analysis_contract.py
      - name: Execute CL-1/CL-2/CL-3 offline contracts only
        run: python -m unittest -v tests.test_cl1_cpu_smoke tests.test_cl1_dense_control_contract tests.test_cl2_protocol_contract tests.test_cl2_data_candidate_contract tests.test_cl2_design_audit_contract tests.test_cl2_shared_rule_candidate_contract tests.test_cl2_nonlinear_control_contract tests.test_cl2_mlp_baseline_contract tests.test_cl2_local_mlp_contract tests.test_cl2_paired_run_plan_contract tests.test_cl2_operation_accounting_contract tests.test_cl2_sparse_forward_contract tests.test_cl2_payload_proxy_contract tests.test_cl2_shared_index_forward_contract tests.test_cl3a_readiness_contract tests.test_cl3b_preflight_contract tests.test_cl3c_dataset_audit_contract tests.test_cl3d_analysis_contract
