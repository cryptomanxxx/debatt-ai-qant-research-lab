name: CL Research Visualization (static, no training)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-static-report:
    name: Static CL-3R graphs (NO TRAINING)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pure visualization contracts
        run: python -m unittest -v tests.test_cl3r_visualization_contract
      - name: Render HTML, SVG, JSON and summary from static source proxies
        run: python -m integrations.continual_learning.cl3r_visualization --output-dir reports/cl3r
      - name: Publish workflow run summary
        run: cat reports/cl3r/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload static visualization artifact
        uses: actions/upload-artifact@v4
        with:
          name: cl3r-static-research-visuals
          path: reports/cl3r/
          retention-days: 14
          if-no-files-found: error
