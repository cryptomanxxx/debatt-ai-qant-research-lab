name: Approve Research Proposal

on:
  workflow_dispatch:
    inputs:
      proposal_id:
        description: "Proposal to approve"
        required: true
        default: "proposal-001-replicate-expanding-topologies"
        type: string
      confirm:
        description: "I reviewed this proposal and approve its compute budget"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  approve:
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile proposal into approved job
        run: python scripts/approve_proposal.py "${{ inputs.proposal_id }}"
      - name: Publish approved job
        run: |
          git config user.name "Debatt-AI Research Approver"
          git config user.email "actions@users.noreply.github.com"
          git add research_queue/jobs/
          git commit -m "Approve research proposal ${{ inputs.proposal_id }}"
          git push
      - name: Resolve approved job ID
        id: approved
        shell: bash
        run: |
          job_file="$(git diff-tree --no-commit-id --name-only -r HEAD -- 'research_queue/jobs/*.json' | head -n 1)"
          if [ -z "$job_file" ]; then
            echo "No approved job file found in approval commit."
            exit 1
          fi
          echo "job_id=$(basename "$job_file" .json)" >> "$GITHUB_OUTPUT"
    outputs:
      job_id: ${{ steps.approved.outputs.job_id }}

  run-approved-job:
    needs: approve
    uses: ./.github/workflows/qant-research-queue-v2.yml
    with:
      job_id: ${{ needs.approve.outputs.job_id }}
    secrets: inherit
