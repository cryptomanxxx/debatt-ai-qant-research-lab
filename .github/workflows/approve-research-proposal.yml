name: Approve Research Proposal

on:
  workflow_dispatch:
    inputs:
      proposal_id:
        description: "Proposal to approve"
        required: true
        default: "proposal-001-replicate-expanding-topologies"
        type: string
      confirm:
        description: "I reviewed this proposal and approve its compute budget"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  approve:
    if: ${{ inputs.confirm }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile proposal into approved job
        run: python scripts/approve_proposal.py "${{ inputs.proposal_id }}"
      - name: Publish approved job
        run: |
          git config user.name "Debatt-AI Research Approver"
          git config user.email "actions@users.noreply.github.com"
          git add research_queue/jobs/
          if git diff --cached --quiet; then
            echo "Approved job already exists; continuing to execution."
          else
            git commit -m "Approve research proposal ${{ inputs.proposal_id }}"
            git push
          fi
      - name: Resolve approved job ID
        id: approved
        shell: bash
        run: |
          job_id="$(python -c 'import json,sys; from pathlib import Path; p=Path("research_queue/proposals")/(sys.argv[1]+".json"); d=json.loads(p.read_text()); m={"proposal-001-replicate-expanding-topologies":"exp006-multiseed-replication","proposal-002-expansion-ratio":"exp007-expansion-ratio","proposal-003-stronger-mnist-validation":"exp008-full-mnist-validation","proposal-004-cross-dataset-validation":"exp009-cross-dataset-validation","proposal-005-qant-fourier-layer":"exp010-qant-fourier-layer","proposal-006-qant-fourier-capacity":"exp011-qant-fourier-capacity","proposal-007-qant-fourier-robust-training":"exp012-qant-fourier-robust-training","proposal-008-qant-fourier-mismatch-diagnostic":"exp013-qant-fourier-mismatch-diagnostic","proposal-009-qant-fourier-error-decomposition":"exp014-qant-fourier-error-decomposition","proposal-010-qant-aligned-training-surrogate":"exp015-qant-aligned-training-surrogate","proposal-011-qant-activation-error-occupancy":"exp016-qant-activation-error-occupancy","proposal-012-qant-logit-margin-diagnostic":"exp017-qant-logit-margin-diagnostic","proposal-013-qant-frequency-controlled-g8":"exp018-qant-frequency-controlled-g8","proposal-014-qant-amplitude-error-accumulation":"exp019-qant-amplitude-error-accumulation","proposal-015-qant-kan-additivity-ladder":"exp020-qant-kan-additivity-ladder","proposal-016-qant-accumulation-scaling-law":"exp021-qant-accumulation-scaling-law","proposal-017-qant-grouped-accumulation-architecture":"exp022-qant-grouped-accumulation-architecture","proposal-018-qant-hierarchical-low-fanin":"exp023-qant-hierarchical-low-fanin","proposal-019-qant-hierarchical-architecture-search":"exp024-qant-hierarchical-architecture-search"}; print(m[d["proposal_id"]])' "${{ inputs.proposal_id }}")"
          test -f "research_queue/jobs/${job_id}.json"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
    outputs:
      job_id: ${{ steps.approved.outputs.job_id }}

  run-approved-job:
    needs: approve
    uses: ./.github/workflows/qant-research-queue-v2.yml
    with:
      job_id: ${{ needs.approve.outputs.job_id }}
    secrets: inherit
