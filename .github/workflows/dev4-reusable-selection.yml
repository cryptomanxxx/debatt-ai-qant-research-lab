name: Dev-4 Reusable Selection Only

on:
  workflow_dispatch:
    inputs:
      round_number:
        description: "Preregistered selection round (currently only 2 is enabled)"
        required: true
        type: choice
        options:
          - '2'

permissions:
  contents: read
  actions: read

concurrency:
  group: dev4-reusable-selection-serialized
  cancel-in-progress: false

jobs:
  select-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Block reruns and previously attempted round before any API call
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REQUESTED_ROUND: ${{ inputs.round_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$RUN_ATTEMPT" = "1" || { echo "::error::Reruns prohibited"; exit 1; }
          python - <<'PY'
          import json, os, urllib.request
          assert os.environ["REQUESTED_ROUND"] == "2", "only audited round two is enabled"
          base=f'https://api.github.com/repos/{os.environ["REPOSITORY"]}/actions/workflows/dev4-reusable-selection.yml/runs?event=workflow_dispatch&per_page=100'
          req=urllib.request.Request(base,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],
            "Accept":"application/vnd.github+json","User-Agent":"dev4-round-guard"})
          with urllib.request.urlopen(req,timeout=30) as response:
           runs=json.load(response)["workflow_runs"]
          # All earlier dispatches are prohibited while only round 2 is enabled,
          # regardless of success/failure. Never use a rerun to replace a proposal.
          previous=[r for r in runs if str(r["id"])!=os.environ["CURRENT_RUN_ID"]]
          assert not previous, "round two has already been dispatched; no duplicate Groq request"
          print("First and only round-two dispatch authorized.")
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen selection adapter dependencies
        run: python -m pip install "numpy==1.26.4" "scikit-learn==1.5.2"
      - name: Validate protocol and own-only round-two context without API or training
        run: |
          python -m scripts.validate_dev4_selection_protocol --ready-for-execution
          python -m scripts.dev4_round_selection --round 2 --output-dir "$RUNNER_TEMP/dev4-round2"
      - name: Make exactly one GPT-OSS request, selection only
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m scripts.dev4_round_selection --round 2 --output-dir "$RUNNER_TEMP/dev4-round2" --execute
      - name: Archive proposal and audit even if response invalid
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev4-round2-selection
          path: ${{ runner.temp }}/dev4-round2/dev4_round2_selection.json
          if-no-files-found: warn
          retention-days: 90
