name: Delete merged PR branches

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: merged-pr-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Delete only verified merged PR head branches
        uses: actions/github-script@v7
        with:
          script: |
            // Load the same policy executed by the isolated Node behaviour tests.
            // This module has no side effects on import; GitHub APIs and Git
            // exec are injected explicitly by github-script.
            const { cleanupMergedPrBranches } = require(
              process.env.GITHUB_WORKSPACE + '/scripts/merged_branch_cleanup.cjs'
            );
            await cleanupMergedPrBranches({ github, context, core, exec });
