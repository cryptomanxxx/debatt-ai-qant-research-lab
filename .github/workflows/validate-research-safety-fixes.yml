name: Validate Research Safety Fixes

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'experiments/030_qant_compatibility_model_v3/run.py'
      - 'integrations/**'
      - 'research_queue/benchmarks/**'
      - 'research_queue/v3_hypotheses/**'
      - 'research_queue/v3_protocols/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  preparation_scope:
    # Only query PR changed filenames; never checkout or execute model code.
    # GitHub's PR files API compares against the PR merge base.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      cl33_only: ${{ steps.changed.outputs.cl33_only }}
    steps:
      - name: Classify exact PR changed-file list via GitHub API (NO MODEL)
        id: changed
        env:
          EVENT_KIND: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          if os.environ["EVENT_KIND"] != "pull_request":
              with open(os.environ["GITHUB_OUTPUT"], "a") as out:
                  out.write("cl33_only=false\n")
              raise SystemExit(0)

          allowed = {
              "integrations/continual_learning/cl33_first_forward_candidate.py",
              "integrations/continual_learning/test_cl33_hard_no_go.py",
              ".github/workflows/cl33-first-forward-no-go.yml",
              ".github/workflows/continual-learning-contracts.yml",
              ".github/workflows/validate-research-safety-fixes.yml",
              ".github/workflows/cl34-sealed-first-forward-no-go.yml",
              ".github/cl34/stage_context.py",
              ".github/cl34/Dockerfile",
          }
          files = []
          for page in range(1, 51):
              url = ("https://api.github.com/repos/"
                     + os.environ["REPO_NAME"] + "/pulls/"
                     + os.environ["PR_NUMBER"] + "/files?per_page=100&page="
                     + str(page))
              request = Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urlopen(request, timeout=15) as response:
                  batch = json.load(response)
              if not isinstance(batch, list):
                  raise RuntimeError("CL-33 NO_GO: malformed PR files response")
              files.extend(item["filename"] for item in batch)
              if len(batch) < 100:
                  break
          else:
              raise RuntimeError("CL-33 NO_GO: PR file list exceeded pagination limit")
          if not files:
              raise RuntimeError("CL-33 NO_GO: empty PR file list")
          cl33_only = set(files).issubset(allowed)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("cl33_only=" + str(cl33_only).lower() + "\n")
          print("CL-33 preparation-only:", cl33_only, "changed files:", len(files))
          PY

  regression:
    needs: preparation_scope
    if: ${{ needs.preparation_scope.outputs.cl33_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Include the PR's base parent so the prior experiment Git blob can
          # also be compared under the SAME Python interpreter where possible.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dry-run RNG dependency
        run: python -m pip install "numpy==1.26.4" "scikit-learn==1.5.2"
      - name: Inspect existing Q.ANT research image digest (no compute)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools inspect ghcr.io/cryptomanxxx/debatt-ai-qant-research-lab:research-py313-v1
      - name: Compile modified Python entrypoints
        run: |
          python -m py_compile scripts/proposal_lineage.py scripts/compile_ai_researcher_proposal.py scripts/materialize_ai_approved_job.py scripts/run_research_job_v2.py scripts/link_research_proposal_outcomes.py
      - name: Test branch cleanup behavior with mocked GitHub APIs and real local Git
        run: node --test tests/test_merged_branch_cleanup_behavior.cjs
      - name: Run focused regression tests
        run: |
          python -m unittest discover -s tests -p 'test_link_research_proposal_outcomes.py' -v
          python -m unittest discover -s tests -p 'test_dev3_entrypoints.py' -v
          python -m unittest discover -s tests -p 'test_merged_branch_cleanup_safety.py' -v
          python -m unittest discover -s tests -p 'test_experiment030_refactor_contract.py' -v
          python -m unittest discover -s tests -p 'test_proposal_lineage.py' -v
          python -m unittest discover -s tests -p 'test_dev3_integration.py' -v
          python -m unittest discover -s tests -p 'test_dev4_selection_protocol.py' -v
          python -m scripts.validate_dev4_selection_protocol
          python -m unittest discover -s tests -p 'test_dev4_history_snapshot.py' -v
          python -m unittest discover -s tests -p 'test_dev4_selection_dry_run.py' -v
          python -m scripts.validate_dev4_selection_protocol --ready-for-execution
          python -m scripts.dev4_selection_dry_run
          python -m scripts.dev4_selection_dry_run --include-random
          python -m unittest discover -s tests -p 'test_dev4_five_round_replay.py' -v
          python -m unittest discover -s tests -p 'test_dev4_policy_adapters.py' -v
          python -m unittest discover -s tests -p 'test_dev4_verified_policy_replay.py' -v
          python -m unittest discover -s tests -p 'test_dev4_first_live_groq_selection.py' -v
          python -m unittest discover -s tests -p 'test_dev4_round1_qant_cpu_contract.py' -v
          python -m unittest discover -s tests -p 'test_dev4_round1_recovery_contract.py' -v
          python -m unittest discover -s tests -p 'test_dev4_round1_recovery2_contract.py' -v
          python -m unittest discover -s tests -p 'test_dev4_round1_isolated_feedback.py' -v
          python -m unittest discover -s tests -p 'test_dev4_round_selection_contract.py' -v
          python -m unittest discover -s tests -p 'test_dev4_authoritative_artifact_contract.py' -v
          python -m unittest discover -s tests -p 'test_dev4_round2_qant_cpu_contract.py' -v
          python -m unittest discover -s tests -p 'test_dev4_round3_context_contract.py' -v
          python -m unittest discover -s tests -p 'test_github_dispatcher_contract.py' -v
          python -m unittest discover -s tests -p 'test_research_memory_v3.py' -v
          python -m scripts.research_memory_v3
          python -m unittest discover -s tests -p 'test_research_tool_calling_v3.py' -v
          python -m scripts.research_tool_calling_v3
          python -m unittest discover -s tests -p 'test_scientific_reasoning_v3.py' -v
          python -m scripts.scientific_reasoning_v3
          python -m unittest discover -s tests -p 'test_live_research_agent_v3.py' -v
          python -m unittest discover -s tests -p 'test_scientific_evaluation_v3.py' -v
          python -m unittest discover -s tests -p 'test_v3_hypothesis_registry.py' -v
          python -m unittest discover -s tests -p 'test_v3_experiment_protocol.py' -v
          python -m unittest discover -s tests -p 'test_critical_review_v3.py' -v
          python -m unittest discover -s tests -p 'test_reviewed_research_session_v3.py' -v
          python -m unittest discover -s tests -p 'test_first_live_research_session_v3.py' -v

  durable_round3_evidence:
    needs: preparation_scope
    if: ${{ needs.preparation_scope.outputs.cl33_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify independently pinned historical records and regenerate contexts
        run: |
          python -m scripts.dev4_round2_isolated_feedback --output /tmp/dev4-round3-regenerated.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path("/tmp/dev4-round3-regenerated.json").read_text())
          frozen=json.loads(Path("research_queue/benchmarks/dev4_round3_isolated_contexts.json").read_text())
          assert actual==frozen, "Round 3 contexts differ from independently pinned evidence"
          assert all(len(c["proposal_status_ledger"])==len(c["completed_paired_outcomes"])==2 for c in actual["contexts"].values())
          print("Four isolated histories verified from content-addressed records.")
          PY
