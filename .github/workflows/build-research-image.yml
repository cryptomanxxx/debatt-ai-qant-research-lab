name: Build Q.ANT Research Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/research-image/Dockerfile"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/research-image/Dockerfile
          push: true
          tags: ghcr.io/cryptomanxxx/debatt-ai-qant-research-lab:research-py313-v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
