name: AI Researcher v1

on:
  workflow_dispatch:
    if: ${{ false }}

permissions:
  contents: read

jobs:
  # Legacy workflow retained for history; direct publication to main is disabled.
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate research proposal
        run: python scripts/ai_researcher_v1.py
      - name: Publish proposal
        run: |
          git config user.name "Debatt-AI AI Researcher"
          git config user.email "actions@users.noreply.github.com"
          git add research_queue/proposals/
          if git diff --cached --quiet; then
            echo "No proposal changes."
            exit 0
          fi
          git commit -m "AI Researcher v1: propose next research step"
          git push
