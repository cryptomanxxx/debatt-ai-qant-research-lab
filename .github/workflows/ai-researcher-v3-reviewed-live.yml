name: AI Researcher v3 Reviewed Live Research (Manual Only)

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Exact new approval: I_APPROVE_ONE_REVIEWED_GROQ_SESSION'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-researcher-v3-reviewed-live
  cancel-in-progress: false

jobs:
  reviewed_research:
    if: ${{ inputs.approval == 'I_APPROVE_ONE_REVIEWED_GROQ_SESSION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate offline evidence and review contracts before secret exposure
        run: |
          python -m unittest discover -s tests -p 'test_research_memory_v3.py' -v
          python -m unittest discover -s tests -p 'test_research_tool_calling_v3.py' -v
          python -m unittest discover -s tests -p 'test_scientific_reasoning_v3.py' -v
          python -m unittest discover -s tests -p 'test_live_research_agent_v3.py' -v
          python -m unittest discover -s tests -p 'test_scientific_evaluation_v3.py' -v
          python -m unittest discover -s tests -p 'test_v3_hypothesis_registry.py' -v
          python -m unittest discover -s tests -p 'test_critical_review_v3.py' -v
          python -m unittest discover -s tests -p 'test_reviewed_research_session_v3.py' -v
      - name: Run one separately approved research and critical-review session
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SESSION_APPROVAL: ${{ inputs.approval }}
        run: |
          python -m scripts.reviewed_research_session_v3 --live --approval "$SESSION_APPROVAL" --output-dir reviewed-research-report
      - name: Publish reviewed research artifact only after success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-researcher-v3-reviewed-report
          path: reviewed-research-report/
          retention-days: 30
          if-no-files-found: error
