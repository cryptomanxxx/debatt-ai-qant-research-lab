name: Q.ANT Guarded Research Queue

on:
  workflow_call:
    inputs:
      job_id:
        description: "Approved research job ID"
        required: true
        type: string
      execution_commit_sha:
        description: "Immutable scientifically verified commit containing execution code"
        required: true
        type: string
      approved_commit_sha:
        description: "Immutable commit containing the approved research job"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: qant-guarded-research-queue
  cancel-in-progress: false

jobs:
  run-job:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/cryptomanxxx/debatt-ai-qant-research-lab:research-py313-v1
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.execution_commit_sha }}
      - name: Verify immutable execution checkout
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="${{ inputs.execution_commit_sha }}"
          test "$actual" = "$expected" || { echo "Execution commit mismatch: expected $expected, got $actual" >&2; exit 1; }
          echo "Pinned execution commit: $actual"
      - name: Import only the approved job artifact
        shell: bash
        run: |
          job_id="${{ inputs.job_id }}"
          [[ "$job_id" =~ ^[a-z0-9][a-z0-9-]{0,95}$ ]] || { echo "Invalid job ID" >&2; exit 1; }
          approved="${{ inputs.approved_commit_sha }}"
          git fetch --no-tags origin "$approved"
          path="research_queue/jobs/$job_id.json"
          mkdir -p research_queue/jobs
          git show "$approved:$path" > "$path.tmp"
          test -s "$path.tmp"
          mv "$path.tmp" "$path"
          test "$(git rev-parse HEAD)" = "${{ inputs.execution_commit_sha }}"
          echo "Execution code remains pinned; imported approved job from $approved."
      - name: Verify prebuilt research environment
        run: python -c "import torch, numpy, ml_dtypes, aeon, qant_native_computing_toolkit; print('Q.ANT research environment ready')"
      - name: Resolve approved job
        id: resolve
        shell: bash
        run: |
          job_id="${{ inputs.job_id }}"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "Resolved approved job: $job_id"
      - name: Preflight compile Python files
        run: |
          python -m compileall -q pnn-v1/experiments
          python -m py_compile scripts/run_research_job_v2.py scripts/approve_proposal.py
      - name: Snapshot PNN results before execution
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pnn-results-before"
          if test -d pnn-v1/results; then
            cp -a pnn-v1/results/. "$RUNNER_TEMP/pnn-results-before/"
          fi
      - name: Validate and run approved job
        run: python scripts/run_research_job_v2.py "${{ steps.resolve.outputs.job_id }}"
      - name: Write execution record
        if: success()
        run: |
          mkdir -p local_results/executions
          printf '{"job_id":"%s","status":"completed","git_commit":"%s","runner":"github-actions","run_id":"%s"}\n'             "${{ steps.resolve.outputs.job_id }}" "${{ inputs.execution_commit_sha }}" "${{ github.run_id }}"             > "local_results/executions/${{ steps.resolve.outputs.job_id }}-${{ github.run_id }}.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=next(Path("local_results/executions").glob("*-${{ github.run_id }}.json"))
          d=json.loads(p.read_text())
          d["approved_job_commit"]="${{ inputs.approved_commit_sha }}"
          p.write_text(json.dumps(d,separators=(",",":"))+"\n")
          PY
      - name: Publish results and execution record
        if: success()
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          shopt -s nullglob
          result_files=(local_results/*.json local_results/*.csv)
          execution_files=(local_results/executions/*)

          # Preserve outputs from the pinned execution outside the Git worktree.
          # Only PNN files created or changed by this run are carried forward;
          # unchanged files from an older pinned checkout must never overwrite main.
          publish_tmp="$(mktemp -d)"
          mkdir -p "$publish_tmp/local_results" "$publish_tmp/pnn_results" "$publish_tmp/executions"
          [ ${#result_files[@]} -gt 0 ] && cp -f "${result_files[@]}" "$publish_tmp/local_results/"
          [ ${#execution_files[@]} -gt 0 ] && cp -f "${execution_files[@]}" "$publish_tmp/executions/"
          for file in pnn-v1/results/*.json pnn-v1/results/*.csv; do
            [ -e "$file" ] || continue
            rel="${file#pnn-v1/results/}"
            before="$RUNNER_TEMP/pnn-results-before/$rel"
            if [ ! -e "$before" ] || ! cmp -s "$file" "$before"; then
              cp -f "$file" "$publish_tmp/pnn_results/$rel"
            fi
          done

          git fetch origin main
          git reset --hard origin/main
          git clean -fd

          mkdir -p results pnn-v1/results executions
          saved_results=("$publish_tmp"/local_results/*)
          saved_pnn_results=("$publish_tmp"/pnn_results/*)
          saved_executions=("$publish_tmp"/executions/*)
          [ ${#saved_results[@]} -gt 0 ] && cp -f "${saved_results[@]}" results/
          [ ${#saved_pnn_results[@]} -gt 0 ] && cp -f "${saved_pnn_results[@]}" pnn-v1/results/
          [ ${#saved_pnn_results[@]} -gt 0 ] && cp -f "${saved_pnn_results[@]}" results/
          [ ${#saved_executions[@]} -gt 0 ] && cp -f "${saved_executions[@]}" executions/

          # Dashboard and research context now see one consistent current-main
          # evidence base plus only this run's newly computed artifacts.
          python scripts/build_research_dashboard.py
          python scripts/build_research_context.py
          export GITHUB_TOKEN="${{ github.token }}"
          export AUTOMATION_GIT_NAME="Debatt-AI Research Runner"
          python scripts/publish_via_pr.py "Complete guarded research job ${{ steps.resolve.outputs.job_id }}" results/ pnn-v1/results/ executions/ public/research-dashboard.json research_queue/context/latest.json
