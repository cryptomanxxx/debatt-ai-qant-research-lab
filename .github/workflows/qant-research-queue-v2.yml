name: Q.ANT Guarded Research Queue

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Approved research job ID"
        required: true
        default: "smoke-test-v2"
        type: string
  workflow_call:
    inputs:
      job_id:
        description: "Approved research job ID"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: qant-guarded-research-queue
  cancel-in-progress: false

jobs:
  run-job:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache Q.ANT CPU wheel
        id: qant-cache
        uses: actions/cache@v4
        with:
          path: .cache/qant-wheel
          key: qant-cpu-wheel-${{ runner.os }}-py313-sdk231-v1
      - name: Install Q.ANT CPU backend
        env:
          QANT_WHEEL_CACHE_DIR: ${{ github.workspace }}/.cache/qant-wheel
        run: bash scripts/setup_qant_cpu.sh
      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py313-cpu-torch-numpy235-ml-dtypes053-aeon160-v2
          restore-keys: |
            pip-${{ runner.os }}-py313-
      - name: Install experiment dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch: research jobs do not use CUDA/NVIDIA libraries.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          # Pin the numerical stack used by the Q.ANT experiments for reproducibility.
          python -m pip install "numpy==2.3.5" "ml_dtypes==0.5.3" "aeon==1.6.0"
      - name: Resolve approved job
        id: resolve
        shell: bash
        run: |
          job_id="${{ inputs.job_id }}"
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "Resolved approved job: $job_id"
      - name: Validate and run approved job
        run: python scripts/run_research_job_v2.py "${{ steps.resolve.outputs.job_id }}"
      - name: Write execution record
        if: success()
        run: |
          mkdir -p local_results/executions
          printf '{"job_id":"%s","status":"completed","git_commit":"%s","runner":"github-actions","run_id":"%s"}\n'             "${{ steps.resolve.outputs.job_id }}" "${{ github.sha }}" "${{ github.run_id }}"             > "local_results/executions/${{ steps.resolve.outputs.job_id }}-${{ github.run_id }}.json"
      - name: Publish results and execution record
        if: success()
        run: |
          mkdir -p results executions
          shopt -s nullglob
          result_files=(local_results/*.json local_results/*.csv pnn-v1/results/*.json pnn-v1/results/*.csv)
          execution_files=(local_results/executions/*)
          [ ${#result_files[@]} -gt 0 ] && cp -f "${result_files[@]}" results/
          [ ${#execution_files[@]} -gt 0 ] && cp -f "${execution_files[@]}" executions/
          python scripts/build_research_dashboard.py
          git config user.name "Debatt-AI Research Runner"
          git config user.email "actions@users.noreply.github.com"
          git add results/ pnn-v1/results/ executions/ public/research-dashboard.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete guarded research job ${{ steps.resolve.outputs.job_id }}"
          # main may have advanced while the experiment was running (for example,
          # dashboard/research commits). Replay this result commit on latest main.
          git pull --rebase origin main
          git push
