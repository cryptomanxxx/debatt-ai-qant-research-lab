name: CL-38 One-Sample Activation Proposal (HARD NO_GO)

on:
  pull_request:
    paths:
      - '.github/workflows/cl38-one-shot-activation-no-go.yml'
      - '.github/cl39/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_locked_activation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify both independent execution locks without importing models
        shell: bash
        run: |
          python3 -I -B .github/cl36/once.py | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["decision"]=="HARD_NO_GO" and x["models_imported"]==0 and x["forward_calls_executed"]==0'
          python3 - <<'PY'
          import ast
          from pathlib import Path
          source=Path(".github/cl36/once.py").read_text()
          tree=ast.parse(source)
          runner=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=="run_one_approved_probe")
          assert "16343837fb8fa14308d0f4c1ba45ec994abcc25f0bda0b565d077b850840668a" in source
          assert "CL43_APPROVAL_TOKEN" in source
          assert source.index("CL-43 HARD NO_GO") < source.index("from integrations.continual_learning.cl2_local_mlp import")
          text=Path(".github/workflows/cl38-one-shot-activation-no-go.yml").read_text()
          assert ("\n  proposed_single_sample_launch:\n    if: " + chr(36) + "{{ false }}") in text, "Launch job must remain impossible to schedule"
          assert "sha256:34b4fb59817acf1a5a5a8318ef34a26b73b691c0bacf2b69666dcb04efdce2ff" in text
          assert "reserveOnce({ github, owner: context.repo.owner" in text, "Future reservation not wired"
          print("HARD NO_GO: no model imported or executed")
          PY
      - name: Prove CL-39 single-use reservation behavior with mock API (NO REMOTE WRITES)
        run: node --test .github/cl39/test_one_shot_reservation.cjs

  # This job is IMPOSSIBLE to schedule in CL-38. Owner approval does not
  # follow from workflow_dispatch, an environment name, or a string input.
  # A LATER separately reviewed commit must revise BOTH independent locks
  # after Marcus approves the exact start, with one-run accounting.
  proposed_single_sample_launch:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    environment: cl38-exact-owner-start-approval
    concurrency:
      group: cl38-one-sample-seed101-T1-index0
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # CL-39 future activation must reserve refs/tags/cl39-once-seed101-t1-train0-three-forwards
      # atomically through GitHub createRef BEFORE any model invocation. No
      # reservation occurs here while this job is statically disabled.
      - name: Stage only the sealed 21-file model image
        run: python3 -B .github/cl36/stage_context.py "$RUNNER_TEMP/cl38-context"
      - name: Build exact pinned image with no model import
        run: |
          docker buildx build --no-cache --platform linux/amd64 --build-arg SOURCE_DATE_EPOCH=0 --output=type=docker,rewrite-timestamp=true --file "$GITHUB_WORKSPACE/.github/cl36/Dockerfile" --tag local/cl38-one-sample:locked "$RUNNER_TEMP/cl38-context"
          test "$(docker image inspect --format '{{.Id}}' local/cl38-one-sample:locked)" = "sha256:34b4fb59817acf1a5a5a8318ef34a26b73b691c0bacf2b69666dcb04efdce2ff"
      # This mutation is part of an IMPOSSIBLE-TO-SCHEDULE job and currently
      # has contents:read, so the API refuses any real tag reservation even
      # if the job-level condition were somehow changed independently.
      # After separate review + exact owner approval, an activation change
      # must deliberately grant only this job contents:write and retain the
      # no-retry, create-if-absent behavior. No reservation occurs in CL-40.
      - name: Atomically reserve experiment identifier once (DISABLED JOB)
        uses: actions/github-script@v7
        with:
          script: |
            const { reserveOnce, EXPECTED_IMAGE_CONFIG_ID } = require(
              process.env.GITHUB_WORKSPACE + '/.github/cl39/one_shot_reservation.cjs'
            );
            await reserveOnce({ github, owner: context.repo.owner,
              repo: context.repo.repo, commitSha: context.sha,
              imageConfigId: EXPECTED_IMAGE_CONFIG_ID });
      # This step is only a reviewable PROPOSAL. The entire job has if:false,
      # contents:read makes the preceding tag reservation fail, and the Python
      # runner unconditionally raises before importing a model. The approval
      # environment has already been separately checked with CL-41 NO_MODEL.
      # A later approval-gated activation PR must resolve all three locks,
      # recompute the image ID if the Python runner changes, and obtain
      # Marcus's exact new-image start approval before any model execution.
      - name: Proposed exact three-forward run (TRIPLE LOCKED; NEVER EXECUTED)
        env:
          CL36_OWNER_APPROVAL_REFERENCE: NOT_AUTHORIZED
          CL36_FINAL_IMAGE_CONFIG_ID: NOT_AUTHORIZED
          CL43_APPROVAL_TOKEN: NOT_AUTHORIZED
        run: |
          docker run --rm --pull=never --network=none --cap-drop=ALL --security-opt=no-new-privileges --read-only --pids-limit=32 --memory=128m --cpus=1 --user=65534:65534 -e CL36_OWNER_APPROVAL_REFERENCE -e CL36_FINAL_IMAGE_CONFIG_ID -e CL43_APPROVAL_TOKEN local/cl38-one-sample:locked --approved-once
