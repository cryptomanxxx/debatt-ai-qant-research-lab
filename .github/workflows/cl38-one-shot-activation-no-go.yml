name: CL-45 Exact Once Numerical Forward (Owner-Gated)

on:
  pull_request:
    paths:
      - '.github/workflows/cl38-one-shot-activation-no-go.yml'
      - '.github/cl39/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_locked_activation:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Verify both independent execution locks without importing models
        shell: bash
        run: |
          python3 -I -B .github/cl36/once.py | python3 -c 'import json,sys; x=json.load(sys.stdin); assert x["decision"]=="HARD_NO_GO" and x["models_imported"]==0 and x["forward_calls_executed"]==0'
          python3 - <<'PY'
          import ast
          from pathlib import Path
          source=Path(".github/cl36/once.py").read_text()
          tree=ast.parse(source)
          runner=next(n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=="run_one_approved_probe")
          assert "16343837fb8fa14308d0f4c1ba45ec994abcc25f0bda0b565d077b850840668a" in source
          assert "CL43_APPROVAL_TOKEN" in source
          assert source.index("CL-43 HARD NO_GO") < source.index("from integrations.continual_learning.cl2_local_mlp import")
          text=Path(".github/workflows/cl38-one-shot-activation-no-go.yml").read_text()
          expected_job_gate = ("\n  proposed_single_sample_launch:\n    if: " + chr(36) + "{{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}")
          assert expected_job_gate in text, "Launch job must be manual/main only"
          assert "sha256:34b4fb59817acf1a5a5a8318ef34a26b73b691c0bacf2b69666dcb04efdce2ff" in text
          assert "reserveOnce({ github, owner: context.repo.owner" in text, "Future reservation not wired"
          print("HARD NO_GO: no model imported or executed")
          PY
      - name: Prove CL-39 single-use reservation behavior with mock API (NO REMOTE WRITES)
        run: node --test .github/cl39/test_one_shot_reservation.cjs

  # Single approved experiment, manual dispatch from main ONLY. GitHub
  # environment requires Marcus as reviewer before any step. A deterministic
  # Git ref reservation prevents retries after the first attempted execution.
  proposed_single_sample_launch:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    environment: cl38-exact-owner-start-approval
    concurrency:
      group: cl38-one-sample-seed101-T1-index0
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Stage only the sealed 21-file model image
        run: python3 -B .github/cl36/stage_context.py "$RUNNER_TEMP/cl38-context"
      - name: Build exact pinned image with no model import
        run: |
          docker buildx build --no-cache --platform linux/amd64 --build-arg SOURCE_DATE_EPOCH=0 --output=type=docker,rewrite-timestamp=true --file "$GITHUB_WORKSPACE/.github/cl36/Dockerfile" --tag local/cl38-one-sample:locked "$RUNNER_TEMP/cl38-context"
          test "$(docker image inspect --format '{{.Id}}' local/cl38-one-sample:locked)" = "sha256:34b4fb59817acf1a5a5a8318ef34a26b73b691c0bacf2b69666dcb04efdce2ff"
      - name: Atomically reserve experiment identifier once (no retries)
        uses: actions/github-script@v7
        with:
          script: |
            const { reserveOnce, EXPECTED_IMAGE_CONFIG_ID } = require(
              process.env.GITHUB_WORKSPACE + '/.github/cl39/one_shot_reservation.cjs'
            );
            await reserveOnce({ github, owner: context.repo.owner,
              repo: context.repo.repo, commitSha: context.sha,
              imageConfigId: EXPECTED_IMAGE_CONFIG_ID });
      # Validate image isolation and token BEFORE consuming the one-shot tag.
      # This no-model runtime probe is intentionally before reservation.
      - name: Observe strict Linux isolation inside final image (NO MODEL)
        run: |
          docker run --rm --pull=never --network=none --cap-drop=ALL --security-opt=no-new-privileges --read-only --pids-limit=32 --memory=128m --cpus=1 --user=65534:65534 --entrypoint python3 local/cl38-one-sample:locked -I -B /opt/research/integrations/continual_learning/cl26_linux_boundary_probe.py
      - name: Verify exact protected owner token without disclosure (NO MODEL)
        env:
          CL43_APPROVAL_TOKEN: ${{ secrets.CL43_APPROVAL_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, hmac, os
          secret=os.environ.get("CL43_APPROVAL_TOKEN", "")
          expected="16343837fb8fa14308d0f4c1ba45ec994abcc25f0bda0b565d077b850840668a"
          if len(secret)!=64 or not hmac.compare_digest(hashlib.sha256(secret.encode("ascii", "strict")).hexdigest(), expected):
              raise SystemExit("CL-45 HARD NO_GO: invalid owner token")
          print("CL-45 protected token digest valid; no token displayed")
          PY
      - name: Exact one-sample three-forward inference (OWNER APPROVED ONLY)
        env:
          CL36_OWNER_APPROVAL_REFERENCE: MARCUS-EXACT-ONE-SAMPLE-SEED101-T1-TRAIN0-THREE-FORWARDS
          CL36_FINAL_IMAGE_CONFIG_ID: sha256:34b4fb59817acf1a5a5a8318ef34a26b73b691c0bacf2b69666dcb04efdce2ff
          CL43_APPROVAL_TOKEN: ${{ secrets.CL43_APPROVAL_TOKEN }}
        run: |
          docker run --rm --pull=never --network=none --cap-drop=ALL --security-opt=no-new-privileges --read-only --pids-limit=32 --memory=128m --cpus=1 --user=65534:65534 -e CL36_OWNER_APPROVAL_REFERENCE -e CL36_FINAL_IMAGE_CONFIG_ID -e CL43_APPROVAL_TOKEN local/cl38-one-sample:locked --approved-once > "$RUNNER_TEMP/cl45-one-sample-results.json"
          python3 - "$RUNNER_TEMP/cl45-one-sample-results.json" <<'PY'
          import json,sys
          from pathlib import Path
          x=json.loads(Path(sys.argv[1]).read_text())
          assert x["kind"]=="CL36_EXPLORATORY_FORWARD_ONLY_OBSERVATION"
          assert x["seed"]==101 and x["task"]=="T1" and x["partition"]=="train" and x["index"]==0
          assert x["forward_calls"]==3 and len(x["traces"])==3
          assert x["training_steps"]==x["gradient_calls"]==x["weight_updates"]==0
          assert x["physical_energy"]=="NOT_MEASURED"
          assert x["image_config_id_claim"]=="sha256:34b4fb59817acf1a5a5a8318ef34a26b73b691c0bacf2b69666dcb04efdce2ff"
          print("CL-45 EXACTLY THREE FORWARDS; NO TRAINING, NO ENERGY")
          PY
      - name: Preserve numerical evidence for separate inspection
        uses: actions/upload-artifact@v4
        with:
          name: cl45-seed101-t1-index0-three-forwards
          path: ${{ runner.temp }}/cl45-one-sample-results.json
          retention-days: 30
